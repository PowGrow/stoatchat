name: Docker Build & Push (custom)

on:
  push:
    branches: [custom]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-custom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build base + api images (amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build base image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/powgrow/stoat-base:latest
          cache-from: type=gha,scope=base
          cache-to: type=gha,scope=base,mode=max

      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/delta/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            BASE_IMAGE=ghcr.io/powgrow/stoat-base:latest
          tags: |
            ghcr.io/powgrow/stoat-api:latest
            ghcr.io/powgrow/stoat-api:${{ github.sha }}
